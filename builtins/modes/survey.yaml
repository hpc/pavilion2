variables:
    survey_counters:
        - PAPI_TOT_CYC
        - PAPI_TOT_INS
        - PAPI_LD_INS
        - PAPI_VEC_DP
        - PAPI_DP_OPS
        - PAPI_FDV_OPS
        - PAPI_FP_INS
        - PAPI_FP_OPS
        - PAPI_L3_TCM
        - PAPI_L2_TCM
        - PAPI_L1_TCM
        - PAPI_TLB_IM
        - PAPI_REF_CYC
        - PAPI_REF_NS
        - PAPI_FUL_CCY
        - PAPI_RES_STL
        - PAPI_TLB_DM
        - PAPI_TLB_TL
    survey?:
        disable_papi_multiplex: False
        disable_papi: False
        disable_io: False
        disable_mpi: False
        disable_ompt: False
        disable_kokkos: False
        use_survey_omp_rt: False
        enable_kokkos: False
        enable_mem: False
        enable_mem_gotcha: False
        module: survey

run:
    modules+: ['{{survey.module}}']

schedule:
    wrapper: >-
        survey {{ opt("--counters", survey_counters.*) }}
        {{ flag("--disable-papi-multiplex", survey.disable_papi_multiplex) }}
        {{ flag("--disable-pap", survey.disable_papi) }}
        {{ flag("--disable-io", survey.disable_io) }}
        {{ flag("--disable-mpi", survey.disable_mpi) }}
        {{ flag("--disable-ompt", survey.disable_ompt) }}
        {{ flag("--disable-kokkos", survey.disable_kokkos) }}
        {{ flag("--user-survey-omp-rt", survey.use_survey_omp_rt) }}
        {{ flag("--enable-kokkos", survey.enable_kokkos) }} 
        {{ flag("--enable-mem", survey.enable_mem) }} 
        {{ flag("--enable-mem-gotcha", survey.enable_mem_gotcha) }}
        --json-only

result_parse:
    json:
        survey:
            files: '*-report.json'
