name: Run demo tests

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
    branches:
      - develop
      - stable

jobs:
  load-python-version:
    name: Load Python version
    runs-on: ubuntu-latest

    outputs:
      default_py_version: ${{steps.load-py-version.outputs.default_py_version}}

    steps:
      - name: Checkout Pavilion repository
        uses: actions/checkout@v4

      - name: Load Python version matrix
        id: load-py-version
        run: |
          echo "default_py_version=$(jq -c '.default_py_version' .github/py-versions.json)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  demo_runs:
    name: Run demo tests
    runs-on: ${{ needs.load-python-version.outputs.default_py_version.os }}
    needs: load-python-version

    steps:
    - name: Checkout Pavilion repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ needs.load-python-version.outputs.default_py_version.python }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ needs.load-python-version.outputs.default_py_version.python }}

    - name: Install dependencies
      run: sudo apt install gcc

    - name: Ensure all tests pass
      run: |
        source examples/demo/activate.sh
        pav run -v QUIET demo advanced buildit
        pav wait
        pav results --all-passed
