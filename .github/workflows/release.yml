name: release

on:
  release:
    types: [published]

jobs:
  announce-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Pavilion ${{ github.event.release.tag_name }} Released
          to: pavilion-announce@lanl.gov
          from: Release Bot <${{ secrets.SMTP_FROM }}>
          body: |
            Pavilion ${{ github.event.release.name }} has been released!

            Repository: ${{ github.repository }}
            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}
            URL: ${{ github.event.release.html_url }}

            Release notes:
            ${{ github.event.release.body }}