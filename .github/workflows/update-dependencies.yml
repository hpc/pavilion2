name: Update Python dependencies

on:
  # The on.push trigger is present only for ease of testing. It should be removed before this
  # workflow is merged into develop.
  push:
    branches:
      - 'hwikle/offline-release-ci'
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch against which to open the PR"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  # BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || github.event.repository.default_branch }}
  # This default is present only for ease of testing. It should be removed and replaced with the above line
  # before this workflow is merged into develop.
  BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || 'hwikle/offline-release-ci' }}
  DEPENDENCY_TYPES: base test docs

jobs:
  update-lockfiles-python-36:
    name: Regenerate lockfiles for Python 3.6
    runs-on: ubuntu-latest
    container: python:3.6

    steps:
      - name: Checkout Pavilion repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Regenerate lockfiles
        # There's a possibility of inconsistencies here between the test and runtime environments
        # if each requires a different version of the same transitive dependency. It's unlikely,
        # but we should think about using a tool like Poetry that supports a single lockfile
        # with multiple dependency groups.
        run: |
          for dep_type in $DEPENDENCY_TYPES; do
            echo "Generating lockfile for ${dep_type}..."
            python -m piptools compile \
              --upgrade \
              --generate-hashes \
              --output-file "requirements/${dep_type}-py36-lock.txt" \
              "requirements/${dep_type}.in"
          done

      - name: Check for inconsistencies between environments
        run: |
          python -m .github/utils/check_inconsistent_deps "requirements/*-py36-lock.txt"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles-py36
          path: requirements/*-py36-lock.txt

  update-lockfiles-modern-python:
    name: Regenerate lockfiles for modern Python
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compute py_tag
        id: py_tag
        shell: bash
        run: |
          PY_TAG="py${{ matrix.python-version }}"
          PY_TAG="${PY_TAG/./}"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Regenerate lockfiles
        # There's a possibility of inconsistencies here between the test and runtime environments
        # if each requires a different version of the same transitive dependency. It's unlikely,
        # but we should think about using a tool like Poetry that supports a single lockfile
        # with multiple dependency groups.
        run: |
          for dep_type in $DEPENDENCY_TYPES; do
            echo "Generating lockfile for ${dep_type}..."
            python -m piptools compile \
              --upgrade \
              --generate-hashes \
              --output-file "requirements/${dep_type}-${{ steps.py_tag.outputs.py_tag }}-lock.txt" \
              requirements/${dep_type}.in
          done

      - name: Check for inconsistencies between environments
        run: |
          python -m .github/utils/check_inconsistent_deps "requirements/*-${{ steps.py_tag.outputs.py_tag }}-lock.txt"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles-${{ steps.py_tag.outputs.py_tag }}
          path: requirements/*-${{ steps.py_tag.outputs.py_tag}}-lock.txt

  create-pr:
    name: Commit updated lockfile and open PR
    runs-on: ubuntu-latest
    needs:
      - update-lockfiles-python-36
      - update-lockfiles-modern-python

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download lockfiles
        uses: actions/download-artifact@v4
        with:
          pattern: lockfile-py*-*
          path: requirements
          merge-multiple: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ci/update-python-dependencies
          commit-message: "Update Python dependency lockfiles"
          title: "Update Python dependency lockfiles"
          body: |
            This PR regenerates the Python dependency lockfiles from:

            - `requirements/base.in`
            - `requirements/test.in`
            - `requirements/docs.in`

            Updated files:
            - `requirements/base-py36-lock.txt`
            - `requirements/base-py310-lock.txt`
            - `requirements/base-py312-lock.txt`
            - `requirements/test-py36-lock.txt`
            - `requirements/test-py310-lock.txt`
            - `requirements/test-py312-lock.txt`
            - `requirements/docs-py36-lock.txt`
            - `requirements/docs-py310-lock.txt`
            - `requirements/docs-py312-lock.txt`

            These lockfiles are generated automatically with `pip-compile --upgrade --generate-hashes`.
          delete-branch: true
          add-paths: |
              requirements/*-py*-lock.txt