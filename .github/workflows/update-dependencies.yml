name: Update Python dependencies

on:
  # The on.push trigger is present only for ease of testing. It should be removed before this
  # workflow is merged into develop.
  push:
    branches:
      - 'hwikle/offline-release-ci'
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch against which to open the PR"
        required: false
        default: ""
        type: string

env:
  # BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || github.event.repository.default_branch }}
  # This default is present only for ease of testing. It should be removed and replaced with the above line
  # before this workflow is merged into develop.
  BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || 'hwikle/offline-release-ci' }}

defaults:
  run:
    shell: bash

jobs:
  load-python-versions:
    name: Load Python versions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      supported_py_versions: ${{ steps.load-py-versions.outputs.supported_py_versions }}
      legacy_py_versions: ${{ steps.load-py-versions.outputs.legacy_py_versions }}
      default_py_version: ${{steps.load-py-versions.outputs.default_py_version}}

    steps:
      - name: Checkout Pavilion repository
        uses: actions/checkout@v4

      - name: Load Python version matrix
        id: load-py-versions
        run: |
          echo "supported_py_versions=$(jq -c '.supported_py_versions' .github/py-versions.json)" >> "$GITHUB_OUTPUT"
          echo "legacy_py_versions=$(jq -c '.legacy_py_versions' .github/py-versions.json)" >> "$GITHUB_OUTPUT"
          echo "default_py_version=$(jq -c '.default_py_version' .github/py-versions.json)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  discover-requirements-groups:
    name: Discover requirements groups
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      requirements-groups: ${{ steps.groups.outputs.requirements-groups }}

    steps:
      - name: Checkout Pavilion repository
        uses: actions/checkout@v4

      - name: Find *.in files
        id: groups
        run: |
          groups=$(find requirements -type f -name "*.in" -print | xargs basename -s .in)
          json=$(echo $groups | jq -R -s -c 'split("\n")[:-1]')
          echo "requirements-groups=$json" >> "$GITHUB_OUTPUT"

  update-lockfiles-modern-python:
    name: Regenerate lockfiles for Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs:
      - load-python-versions
      - discover-requirements-groups

    permissions:
      contents: read

    strategy:
      matrix:
        include: ${{ fromJson(needs.load-python-versions.outputs.supported_py_versions) }}

    steps:
      - name: Check out Pavilion repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Compute py_tag
        id: py_tag
        run: |
          PY_TAG="py${{ matrix.python }}"
          PY_TAG="${PY_TAG/./}"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev-py${{ steps.py_tag.outputs.py_tag }}-lock.txt || python -m pip install -r requirements/dev.in

      - name: Regenerate lockfiles
        # There's a possibility of inconsistencies here between the test and runtime environments
        # if each requires a different version of the same transitive dependency. It's unlikely,
        # but we should think about using a tool like Poetry that supports a single lockfile
        # with multiple dependency groups.
        run: |
          for dep_type in $(${{ needs.discover-requirements-groups.outputs.requirements-groups }} | jq -r '.[]'); do
            python -m piptools compile \
              --upgrade \
              --generate-hashes \
              --no-strip-extras \
              --output-file "requirements/${dep_type}-${{ steps.py_tag.outputs.py_tag }}-lock.txt" \
              requirements/${dep_type}.in
          done

      - name: Check for inconsistencies between environments
        # For now we'll just issue a warning, and not fail, if inconsistencies are found.
        run: python dev-utils/check_inconsistent_deps.py "requirements/*-${{ steps.py_tag.outputs.py_tag }}-lock.txt"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v6
        with:
          name: lockfiles-${{ steps.py_tag.outputs.py_tag }}
          path: requirements/*-${{ steps.py_tag.outputs.py_tag}}-lock.txt

  update-lockfiles-legacy-python:
    name: Regenerate lockfiles for Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    container: python:${{ matrix.python }}
    needs:
      - load-python-versions
      - discover-requirements-groups

    permissions:
      contents:
        read

    strategy:
      matrix:
        include: ${{ fromJson(needs.load-python-versions.outputs.legacy_py_versions) }}

    steps:
      - name: Checkout Pavilion repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Compute py_tag
        id: py_tag
        run: |
          PY_TAG="py${{ matrix.python }}"
          PY_TAG="${PY_TAG/./}"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Remove minimum version from coverage
        # The features we need from coverage don't exist before version 7.10, but it doesn't
        # really matter since we only run coverage under newer versions of Python.
        run: sed -i 's/coverage>=7.10/coverage/' requirements/dev.in

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev-py${{ steps.py_tag.outputs.py_tag }}-lock.txt || python -m pip install -r requirements/dev.in

      - name: Regenerate lockfiles
        # There's a possibility of inconsistencies here between the test and runtime environments
        # if each requires a different version of the same transitive dependency. It's unlikely,
        # but we should think about using a tool like Poetry that supports a single lockfile
        # with multiple dependency groups.
        run: |
          for dep_type in $(${{ needs.discover-requirements-groups.outputs.requirements-groups }} | jq -r '.[]'); do
            python -m piptools compile \
              --upgrade \
              --generate-hashes \
              --output-file "requirements/${dep_type}-${{ steps.py_tag.outputs.py_tag }}-lock.txt" \
              "requirements/${dep_type}.in"
          done

      - name: Check for inconsistencies between environments
        # For now we'll just issue a warning, and not fail, if inconsistencies are found.
        run: |
          python .github/utils/check_inconsistent_deps.py "requirements/*-${{ steps.py_tag.outputs.py_tag }}-lock.txt"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v6
        with:
          name: lockfiles-${{ steps.py_tag.outputs.py_tag }}
          path: requirements/*-${{ steps.py_tag.outputs.py_tag }}-lock.txt

  create-pr:
    name: Commit updated lockfiles and open PR
    runs-on: ubuntu-latest
    needs:
      - update-lockfiles-modern-python
      - update-lockfiles-legacy-python

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out Pavilion repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Remove old lockfiles
        run: |
          git rm requirements/*-py*-lock.txt

      - name: Download lockfiles
        uses: actions/download-artifact@v6
        with:
          pattern: lockfiles-py*
          path: requirements
          merge-multiple: true

      - name: Stage new lockfiles
        run: |
          git add requirements/*-py*-lock.txt

      - name: Collect git status output
        id: pr-changes
        run: |
          {
            echo 'inputs<<EOF'
            printf '%s\n' requirements/*.in | sort | awk '{print "- `" $0 "`"}'
            echo 'EOF'
          }
          {
            echo 'added<<EOF'
            git status --porcelain | sort | awk 'substr($0,1,1) == "A" {print "- `" substr($0,4) "`"}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'modified<<EOF'
            git status --porcelain | sort | awk 'substr($0,1,1) == "M" {print "- `" substr($0,4) "`"}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'deleted<<EOF'
            git status --porcelain | sort | awk 'substr($0,1,1) == "D" {print "- `" substr($0,4) "`"}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ci/update-python-dependencies
          commit-message: "Update Python dependency lockfiles"
          title: "Update Python dependency lockfiles"
          body: |
            This PR regenerates the Python dependency lockfiles from:

            ${{ steps.pr-changes.outputs.inputs}}

            ${{ steps.pr-changes.outputs.added != '' && format('New files:\n{0}\n', steps.pr-changes.outputs.added) || '' }}

            ${{ steps.pr-changes.outputs.modified != '' && format('Updated files:\n{0}\n', steps.pr-changes.outputs.modified) || '' }}

            ${{ steps.pr-changes.outputs.deleted != '' && format('Deleted files:\n{0}\n', steps.pr-changes.outputs.deleted) || '' }}

            These lockfiles are generated automatically with `pip-compile --upgrade --generate-hashes`.

            **This PR was generated automatically by the `update-dependencies` workflow. Please
            review if carefully.**
          delete-branch: true