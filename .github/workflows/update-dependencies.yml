name: Update Python dependencies

on:
  push:
    branches: [hwikle/offline-release-ci]
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch against which to open the PR"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  # BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || github.event.repository.default_branch }}
  BASE_BRANCH: ${{ inputs.base_branch != '' && inputs.base_branch || 'hwikle/offline-release-ci' }}

jobs:
  update-lockfile-python-36:
    name: Regenerate ${{ matrix.dep_type }} lockfile for Python 3.6
    runs-on: ubuntu-latest
    container: python:3.6

    strategy:
      fail-fast: false
      matrix:
        dep_type: [base, test, docs]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Regenerate lockfile
        run: |
          python -m piptools compile \
            --upgrade \
            --generate-hashes \
            --output-file "requirements/${{ matrix.dep_type }}-py36-lock.txt" \
            requirements/${{ matrix.dep_type }}.in

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-py36-${{ matrix.dep_type }}
          path: requirements/${{ matrix.dep_type }}-py36-lock.txt

  update-lockfiles-modern-python:
    name: Regenerate ${{ matrix.dep_type }} lockfile for modern Python
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dep_type: [base, test, docs]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compute lockfile path
        id: vars
        shell: bash
        run: |
          PY_TAG="py${{ matrix.python-version }}"
          PY_TAG="${PY_TAG/./}"
          echo "py_tag=${PY_TAG}" >> "$GITHUB_OUTPUT"
          echo "lockfile=requirements/${{ matrix.dep_type }}-${PY_TAG}-lock.txt" >> "$GITHUB_OUTPUT"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Regenerate lockfile
        run: |
          python -m piptools compile \
            --upgrade \
            --generate-hashes \
            --output-file "${{ steps.vars.outputs.lockfile }}" \
            requirements/${{ matrix.dep_type }}.in

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-${{ steps.vars.outputs.py_tag }}-${{ matrix.dep_type }}
          path: ${{ steps.vars.outputs.lockfile }}

  create-pr:
    name: Commit updated lockfile and open PR
    runs-on: ubuntu-latest
    needs:
      - update-lockfile-python-36
      - update-lockfiles-modern-python

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download lockfiles
        uses: actions/download-artifact@v4
        with:
          pattern: lockfile-py*-*
          path: requirements
          merge-multiple: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ci/update-python-dependencies
          commit-message: "Update Python dependency lockfiles"
          title: "Update Python dependency lockfiles"
          body: |
            This PR regenerates the Python dependency lockfiles from:

            - `requirements/base.in`
            - `requirements/test.in`
            - `requirements/docs.in`

            Updated files:
            - `requirements/base-py36-lock.txt`
            - `requirements/base-py310-lock.txt`
            - `requirements/base-py312-lock.txt`
            - `requirements/test-py36-lock.txt`
            - `requirements/test-py310-lock.txt`
            - `requirements/test-py312-lock.txt`
            - `requirements/docs-py36-lock.txt`
            - `requirements/docs-py310-lock.txt`
            - `requirements/docs-py312-lock.txt`

            These lockfiles are generated automatically with `pip-compile --upgrade --generate-hashes`.
          delete-branch: true
          add-paths: |
              requirements/*-py*-lock.txt