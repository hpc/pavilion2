name: coverage

on:
  schedule:
    # Run at midnight on the first of the month
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      timeout:
        description: "Timeout value (in seconds) for Pavilion unit tests"
        required: true
        default: 300
        type: number
      lock_lifetime:
        description: "Lifetime (in seconds) after which a lock may be 'stolen' by other processes"
        required: true
        default: 300
        type: number

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt
        pip install "coverage>=7.10,<8"

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        ./test/utils/spack_setup test

    - name: run_tests
      env:
        # coverage causes unit tests to run several times slower, so we need to increase the timeout
        PAV_UNITTEST_UNIVERSAL_TIMEOUT: ${{ inputs.timeout || 300}}
        PAV_UNITTEST_LOCK_LIFETIME: ${{ inputs.lock_lifetime || 300}}
      run: |
        echo "PAV_UNITTEST_UNIVERSAL_TIMEOUT: $PAV_UNITTEST_UNIVERSAL_TIMEOUT"
        echo "PAV_UNITTEST_LOCK_LIFETIME: $PAV_UNITTEST_LOCK_LIFETIME"
        sudo -E su $USER -c "PATH=$PATH; python -m coverage run ./test/run_tests --skip style --skip docs"

    - name: Generate and show report
      run: |
        python -m coverage combine
        python -m coverage report
        python -m coverage xml
        python -m coverage html

    - name: Upload XML coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml

    - name: Upload HTML coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: htmlcov