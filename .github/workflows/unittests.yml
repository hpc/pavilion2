#      with:
#        fail_ci_if_error: true
#        token: c1100f28-f36f-4b92-8ba5-ec907a1bfea6

  unittests-3_10:
    runs-on: ubuntu-latest
    needs:
        - style
        - docs

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        ./test/utils/spack_setup test

    - name: run_tests
      run: |
        sudo -E su $USER -c "PATH=$PATH; ./test/run_tests"

    - name: zip_working_dir
      if: failure()
      run: |
        # If we don't zip this ourselves, it will run infinitely due to
        # symlink loops.
        cd test
        ./utils/make_symlinks_relative working_dir
        zip -yr working_dir.zip working_dir

    - name: logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test_output_2.10
        path: test/working_dir.zip

  unittests-3_12:
    runs-on: ubuntu-latest
    needs:
        - style
        - docs

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt
        pip install -r "coverage>=7.10,<8"

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        ./test/utils/spack_setup test

    - name: run_tests
      run: |
        sudo -E su $USER -c "PATH=$PATH; python -m coverage run ./test/run_tests"

    - name: zip_working_dir
      if: failure()
      run: |
        # If we don't zip this ourselves, it will run infinitely due to
        # symlink loops.
        cd test
        ./utils/make_symlinks_relative working_dir
        zip -yr working_dir.zip working_dir

    - name: logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test_output_2.10
        path: test/working_dir.zip

    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: .coverage*

  coverage:
    runs-on: ubuntu-latest
    needs: [unittests-3_12]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage>=7,<8

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Generate and show report
        run: |
          cp coverage-artifacts/.coverage* .
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
          python -m coverage html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: xmlcov