name: unittests

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
    branches:
      - develop
      - stable

jobs:
  # The debug job is meant for debugging CI related issues.
  debug:
    # Comment out the following line to enable.
    if: ${{ false }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        #echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        #./test/utils/spack_setup test

    # Set run_tests to run only the specific tests you need to fix.
    - name: run_tests
      run: |
        ./test/run_tests

    - name: zip_working_dir
      if: always()
      run: |
        # If we don't zip this ourselves, it will run infinitely due to
        # symlink loops.
        cd test
        ./utils/make_symlinks_relative working_dir
        zip -yr working_dir.zip working_dir

    - name: logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test_output
        path: test/working_dir.zip

  style:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml

    - name: run_tests
      run: |
        sudo -E su $USER -c "PATH=$PATH; ./test/run_tests -q -o style -o debug_prints"

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml

    - name: run_tests
      run: ./test/run_tests -o 'doc*' -q

  unittests-python-36:
    # We run this as a separate job because Python 3.6 is deprecated by GitHub, but it will still
    # work in a container
    runs-on: ubuntu-latest
    container: python:3.6
    needs:
    - style
    - docs

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt
        sphinx-build --version
        pylint --version

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        ./test/utils/spack_setup test

    - name: run_tests
      run: |
        ./test/run_tests

    - name: zip_working_dir
      if: failure()
      run: |
        # If we don't zip this ourselves, it will run infinitely due to
        # symlink loops.
        cd test
        ./utils/make_symlinks_relative working_dir
        zip -yr working_dir.zip working_dir

    - name: logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test_output_3.6
        path: test/working_dir.zip

  unittests-modern-python:
    runs-on: ubuntu-latest
    needs:
        - style
        - docs

    strategy:
      matrix:
        python-version: ["3.7", "3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test/requirements.txt
        pip install -r docs/requirements.txt
        sphinx-build --version
        pylint --version

    - name: setup
      run: |
        ln -s pavilion.yaml.ci test/data/pav_config_dir/pavilion.yaml
        echo "working_dir: $(pwd)/test/working_dir" >> test/data/pav_config_dir/pavilion.yaml
        echo "spack_path: $(pwd)/test/spack" >> test/data/pav_config_dir/pavilion.yaml
        ./test/utils/spack_setup test

    - name: run_tests
      run: |
        ./test/run_tests

    - name: zip_working_dir
      if: failure()
      run: |
        # If we don't zip this ourselves, it will run infinitely due to
        # symlink loops.
        cd test
        ./utils/make_symlinks_relative working_dir
        zip -yr working_dir.zip working_dir

    - name: logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test_output_${{ matrix.python-version }}
        path: test/working_dir.zip